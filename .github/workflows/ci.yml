name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS is not decoration: sessui shells out to tmux and cp3 and is run
    # on Darwin, but every check before this ran on Linux only. This is the
    # cheapest place to learn that a change broke the Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # The tests that matter drive a real tmux server of their own and skip
      # without one, so a runner with no tmux would pass having checked nothing.
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -q && sudo apt-get install -y -q tmux; fi
          tmux -V

      - name: test
        run: go test -race ./...

      - name: shellcheck the plugin entry point
        if: runner.os == 'Linux'
        run: shellcheck -S warning sessui.tmux


  # Proof the release matrix compiles, on every push rather than only at tag
  # time -- a tag that fails to build is a bad afternoon.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build all release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "--- $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null . || exit 1
          done
